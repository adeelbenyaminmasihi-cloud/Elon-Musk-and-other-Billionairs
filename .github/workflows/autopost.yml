name: Billionaire Pinterest Auto-Poster

on:
  schedule:
    - cron: '20 */2 * * *'  # Din mein lagbhag 10 bar chalega
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Generate 2 Fresh Pins
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python main.py

      - name: Commit & Push Pins to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pin_*.png
          git commit -m "Auto-post fresh billionaire pins" || echo "No changes to commit"
          git push

      - name: Send Batch Data to Make.com Webhook
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          BRIDGE_PAGE_URL: ${{ secrets.BRIDGE_PAGE_URL }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          python -c '
          import os, json, time, requests
          with open("batch_payload.json") as f:
              batch = json.load(f)
          repo = os.environ["REPO_FULL_NAME"]
          webhook = os.environ["MAKE_WEBHOOK_URL"]
          bridge = os.environ["BRIDGE_PAGE_URL"]
          
          for idx, item in enumerate(batch):
              ts = int(time.time())
              # Image ka public URL
              image_url = f"https://raw.githubusercontent.com/{repo}/main/{item[\"local_file\"]}?v={ts}"
              payload = {
                  "title": item["pin_title"],
                  "description": item["pin_description"],
                  "image_url": image_url,
                  "destination_link": bridge,
                  "billionaire": item["billionaire"]
              }
              r = requests.post(webhook, json=payload)
              print(f"Sent pin {idx+1} ({item[\"billionaire\"]}) - Status: {r.status_code}")
              time.sleep(25) # Pinterest rate-limit safety pause
          '
